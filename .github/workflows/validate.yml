name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    name: Validate marketplace + plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check manifests and skill structure
        run: node scripts/validate-manifests.mjs

  no-secrets:
    name: Guard against committed data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if real-data paths were committed
        run: |
          set -e
          # These paths should never exist in the public repo. They hold a
          # user's private context and are .gitignored. Example data lives only
          # under plugins/*/examples/.
          bad=0
          for p in business personal journal tasks.md calendar.json; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              echo "ERROR: committed private-data path: $p"
              bad=1
            fi
          done
          exit $bad
